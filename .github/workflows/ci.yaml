name: Cache CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Some Go files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Check code
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build application
        run: go build -o bin/cache-server ./cmd/cache-server